<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Барабанная тетрадь</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#e8ecef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1013" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Барабаны">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Sofia+Sans+Extra+Condensed:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: one phone-width column. Bar strip on top, the staff sits directly over a tap grid
     whose columns line up with the notes, transport pinned to the bottom edge. */
  --bg:#e8ecef;
  --surface:#ffffff;
  --surface-2:#f1f4f6;
  --ink:#12161b;
  --muted:#586470;
  --line:#ccd4db;
  --line-strong:#8795a2;
  --accent:#cf3a28;
  --accent-ink:#ffffff;
  --cym:#8f5f00;   /* cymbals: brass */
  --drum:#c2331f;  /* shells: red wrap */
  --foot:#1c54a3;  /* pedals */
  --display:'Sofia Sans Extra Condensed','Avenir Next Condensed','Roboto Condensed','Arial Narrow',sans-serif;
  --body:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --label:56px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1013; --surface:#171c21; --surface-2:#1e252c; --ink:#edf1f4; --muted:#96a3af;
    --line:#2a333c; --line-strong:#5b6975; --accent:#ff6b57; --accent-ink:#1c0b08;
    --cym:#e7b548; --drum:#ff7c68; --foot:#78b0ff; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1013; --surface:#171c21; --surface-2:#1e252c; --ink:#edf1f4; --muted:#96a3af;
  --line:#2a333c; --line-strong:#5b6975; --accent:#ff6b57; --accent-ink:#1c0b08;
  --cym:#e7b548; --drum:#ff7c68; --foot:#78b0ff; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.35 var(--body);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
/* a tool, not a text: holding a finger on it must not start the phone's select/copy */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,select,textarea{-webkit-user-select:text;user-select:text}
.pad svg,.cell svg{-webkit-user-drag:none}
button,input,select{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.top{display:flex;gap:8px;align-items:center;padding:12px 16px 8px}
.title{flex:1;min-width:0;height:40px;border:0;border-bottom:2px solid transparent;background:transparent;font:800 26px/1 var(--display);letter-spacing:.01em;padding:0 2px;border-radius:0;text-overflow:ellipsis}
.title:focus{outline:none;border-bottom-color:var(--accent)}
.chip{height:36px;padding:0 12px;border:1px solid var(--line);background:var(--surface);border-radius:9px;font:700 17px/1 var(--display);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.chip:active{background:var(--surface-2)}
.chip[disabled]{opacity:.4}
.chip.warn{border-color:var(--accent);color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{height:34px;padding:0 12px;border:0;background:transparent;font:700 17px/1 var(--display);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--ink);color:var(--surface)}
main{display:flex;flex-direction:column;gap:10px;padding:0 16px 12px}
.strip{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:0 0 auto;min-width:40px;height:40px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font:800 20px/1 var(--display);font-variant-numeric:tabular-nums}
.strip button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.strip button.add{border-style:dashed;color:var(--muted);font-weight:500;font-size:24px}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tools select{height:36px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:0 8px;font:700 18px/1 var(--display)}
.pad{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;isolation:isolate}
.tape{position:relative;display:flex;align-items:stretch;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;scroll-padding-left:var(--label);overscroll-behavior-x:contain}
.labels{position:sticky;left:0;z-index:3;flex:0 0 var(--label);background:var(--surface);box-shadow:2px 0 0 var(--line-strong)}
.lnot,.bnot{color:var(--ink);border-bottom:1px solid var(--line)}
.lnot{overflow:hidden}
.lnot svg,.bnot svg{display:block}
.bnot svg{overflow:visible}
.barblk{flex:0 0 var(--barw);min-width:0;scroll-snap-align:start}
.bgrid{display:grid;grid-template-columns:repeat(var(--n),1fr)}
@media (hover:none){ .tape{scrollbar-width:none} .tape::-webkit-scrollbar{display:none} }
.addblk{flex:0 0 56px;border:0;border-left:2px solid var(--line-strong);background:var(--surface-2);color:var(--muted);font:500 30px/1 var(--display)}
.lab{font:700 16px/32px var(--display);letter-spacing:.03em;text-transform:uppercase;padding-left:8px;white-space:nowrap;overflow:hidden;box-shadow:inset 0 -1px 0 var(--line)}
.cnt{font:700 13px/20px var(--display);text-align:center;color:var(--muted);height:20px;box-shadow:inset 0 -1px 0 var(--line)}
.cnt.b0{color:var(--ink);font-size:15px;box-shadow:inset 0 -1px 0 var(--line),inset 2px 0 0 var(--line-strong)}
.cell{height:32px;border:0;padding:0;margin:0;background:var(--surface);box-shadow:inset 0 -1px 0 var(--line),inset 1px 0 0 var(--line);display:grid;place-items:center;border-radius:0}
.cell.alt{background:var(--surface-2)}
.cell.b0{box-shadow:inset 0 -1px 0 var(--line),inset 2px 0 0 var(--line-strong)}
.cell svg{display:block;width:100%;max-width:20px;height:20px}
.cell[data-v="a"]{background:color-mix(in srgb,currentColor 16%,var(--surface))}
.cell.st{height:28px;font:800 17px/1 var(--display);color:var(--ink)}
.f-cym{color:var(--cym)} .f-drum{color:var(--drum)} .f-foot{color:var(--foot)}
.lab.st{color:var(--muted);line-height:28px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.staffmode .bnot{touch-action:none;cursor:crosshair}
.stf{position:absolute;left:0;top:0;z-index:2;pointer-events:none}
.stf .col{position:absolute;top:0;background:color-mix(in srgb,var(--accent) 14%,transparent)}
.stf .hd{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:currentColor;display:grid;place-items:center;font:800 20px/1 var(--body)}
.stf .hd.x{background:none}
.stf .tip{position:absolute;transform:translate(-50%,0);white-space:nowrap;padding:4px 9px;border-radius:8px;background:var(--ink);color:var(--surface);font:700 17px/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase}
.nf .stf .tip{font:600 13px/1.2 var(--body);text-transform:none;letter-spacing:0}
.cell,.bnot{-webkit-touch-callout:none}
.notemenu{position:fixed;z-index:15;display:flex;flex-wrap:wrap;gap:4px;max-width:calc(100% - 16px);padding:6px;border-radius:12px;background:var(--surface);border:1px solid var(--line-strong);box-shadow:0 6px 24px rgba(0,0,0,.28)}
.notemenu button{height:40px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font:700 17px/1 var(--display);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.notemenu button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.nf .notemenu button{font:600 14px/1 var(--body);text-transform:none;letter-spacing:0}
.playhead{position:absolute;top:0;bottom:0;z-index:1;pointer-events:none;background:color-mix(in srgb,var(--accent) 18%,transparent);border-left:2px solid var(--accent)}
.palette{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.langrow{display:flex;padding:0 16px 14px}
.langrow .seg button{height:32px;font-size:16px}

.hint{margin:0;color:var(--muted);font-size:13px}
.status{margin:0;color:var(--muted);font-size:12.5px}
.sheetbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sheetbar span{font:700 16px/1 var(--display);letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:12px;color:var(--ink);overflow-x:auto}
.paper svg{display:block;width:100%;height:auto}
.paper .hit{cursor:pointer}
.paper img.pg{display:block;width:100%;height:auto;background:#fff;border-bottom:8px solid var(--bg);-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.transport{position:sticky;bottom:0;z-index:5;margin-top:auto;display:flex;gap:8px;align-items:center;padding:10px 16px;background:var(--surface);border-top:1px solid var(--line)}
.play{flex:0 0 auto;width:52px;height:52px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.play svg{width:24px;height:24px}
.bpm{flex:0 0 auto;display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.bpm button{flex:0 0 30px;width:30px;padding:0;height:44px;border:0;background:transparent;font:500 24px/1 var(--display)}
.bpm input{flex:0 0 46px;width:46px;min-width:0;height:44px;border:0;background:transparent;text-align:center;font:800 26px/1 var(--display);font-variant-numeric:tabular-nums;-moz-appearance:textfield;padding:0;border-radius:0}
.bpm input::-webkit-outer-spin-button,.bpm input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.tog{flex:1 1 0;min-width:0;height:44px;padding:0 3px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font:700 14.5px/1.05 var(--display);letter-spacing:.02em;text-transform:uppercase}
/* signed-out visitors get a platform sign-in notice over the bottom edge: keep the controls above it */
.guest .transport{padding-bottom:100px}
@media (min-width:560px){ .guest .transport{padding-bottom:60px} }
.tog[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.panel{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 45%,transparent);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheetbox{width:100%;max-width:760px;max-height:82%;overflow:auto;background:var(--surface);border-radius:16px 16px 0 0;padding:16px;display:flex;flex-direction:column;gap:10px}
.sheetbox h2{margin:0;font:800 28px/1 var(--display);letter-spacing:.01em;text-wrap:balance}
.songrow{display:flex;gap:8px;align-items:stretch}
.folders{display:flex;flex-wrap:wrap;gap:6px}.folders .chip{height:34px;font-size:15px}
#folderName{height:42px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font:16px/1 var(--body);background:var(--surface);color:inherit;-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
.songrow .open{flex:1;min-width:0;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:8px 12px}
.songrow .open[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.songrow b{display:block;font:700 21px/1.15 var(--display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.songrow small{color:var(--muted);font-size:13px}
.songrow .open{position:relative}.songrow .ord{position:absolute;right:8px;top:50%;transform:translateY(-50%);min-width:30px;height:30px;padding:0 6px;border-radius:15px;background:var(--accent);color:#fff;font:700 15px/30px var(--body);text-align:center}
.picking .songrow .open[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}.picking .songrow .open{padding-right:46px}
.pickbar{position:sticky;bottom:-16px;margin:0 -16px -16px;padding:10px 16px;background:var(--surface);border-top:1px solid var(--line-strong);display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.pickbar[hidden]{display:none}
.pickbar #pickInfo{font:600 15px/1.2 var(--body)}.chip.go{background:var(--accent);color:#fff;border-color:var(--accent)}.chip.go:disabled{opacity:.45}
.panelrow{display:flex;gap:8px;justify-content:space-between;align-items:center}
.hdrbtns{display:flex;gap:8px}.hdrbtns.wrap{flex-wrap:wrap}
.recmeter{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.recmeter[hidden]{display:none}.recmeter i{display:block;height:100%;width:0;background:var(--accent);transition:width .08s linear}
#recLatRow .hint{margin:0;flex:1}
.metro-bpm{display:flex;align-items:center;justify-content:center;gap:18px}#mBpm{font:800 64px/1 var(--display);min-width:3ch;text-align:center;font-variant-numeric:tabular-nums}
.chip.bigsq{width:56px;height:56px;font:500 32px/1 var(--body);padding:0}#metroPanel input[type=range]{width:100%;accent-color:var(--accent)}
.metro-dots{display:flex;gap:12px;justify-content:center;min-height:22px}.metro-dots i{width:20px;height:20px;border-radius:50%;background:var(--line)}.metro-dots i.on{background:var(--ink)}.metro-dots i.on.first{background:var(--accent)}
.seg.wide{display:flex;flex-wrap:wrap}.seg.wide button{flex:1;padding:0 6px}.msel{height:40px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:0 10px;font:600 17px/1 var(--body)}
.bigbtn{height:58px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font:800 22px/1 var(--display);letter-spacing:.02em}.bigbtn[aria-pressed=true]{background:var(--ink);color:var(--surface)}.bigbtn:disabled{opacity:.45}
.photobox{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 12px;border:1px solid var(--line-strong);border-radius:10px;font-size:14px}
.photobox[hidden]{display:none}
.photorow{display:flex;gap:8px}.photorow #btnPhoto{flex:1}
.sheetbox>*{flex-shrink:0}
.keybox h3{margin:0;font:700 17px/1.2 var(--body)}
.keybox{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border:1px solid var(--line-strong);border-radius:10px}.keybox[hidden]{display:none}
.keybox input{height:42px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font:16px/1 var(--body);background:var(--surface);color:inherit;-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
.lab[data-row]{cursor:pointer}
.lab[data-row]:active,.lab[data-row][aria-expanded="true"]{background:var(--line)}
.folders .chip.lib{border-style:dashed}
.notemenu .mh{flex:0 0 100%;font:600 13px/1.3 var(--body);color:var(--muted);padding:2px 4px 4px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:10px;font-size:14px;z-index:20;max-width:calc(100% - 32px);text-align:center}
.nf .lab{font:700 12.5px/32px var(--body);text-transform:none;letter-spacing:0;padding-left:6px}
.nf .chip,.nf .seg button,.nf .tools select{font:600 14px/1 var(--body);text-transform:none;letter-spacing:0}
.nf .tog{font:600 12px/1.1 var(--body);text-transform:none;letter-spacing:0}
.nf .title{font:700 19px/1 var(--body)}
.nf .cnt{font:600 11px/20px var(--body)} .nf .cnt.b0{font-size:12.5px}
.nf .strip button,.nf .bpm input,.nf .cell.st{font-family:var(--body);font-size:17px}
.nf .langrow .seg button{font-size:13px}
.nf .sheetbar span{font:600 13px/1 var(--body);text-transform:none;letter-spacing:0}
.nf .sheetbox h2{font:700 22px/1.1 var(--body)} .nf .songrow b{font:700 16px/1.2 var(--body)}
@media (min-width:560px){ .cell{height:36px} .lab{line-height:36px} :root{--label:68px} .nf .lab{line-height:36px} }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="chip" id="btnSongs" type="button">Песни</button>
    <input class="title" id="title" type="text" maxlength="80" autocomplete="off" aria-label="Название песни">
    <div class="seg" id="viewSeg" role="tablist" aria-label="Вид">
      <button id="tabGrid" type="button" role="tab" aria-selected="true">Сетка</button>
      <button id="tabSheet" type="button" role="tab" aria-selected="false">Ноты</button>
    </div>
  </header>

  <main id="viewGrid">
    <div class="strip" id="strip" aria-label="Такты"></div>
    <div class="tools">
      <select id="sig" aria-label="Размер">
        <option>4/4</option><option value="2/2">2/2 (¢)</option><option>3/4</option><option>2/4</option><option>5/4</option><option>6/8</option><option>12/8</option>
      </select>
      <select id="swing" aria-label="Свинг">
        <option value="0" id="swing0">Ровно</option><option value="30" id="swing30">Свинг лёгкий</option><option value="60" id="swing60">Свинг</option><option value="100" id="swing100">Шаффл</option>
      </select>
      <div class="seg" id="divSeg" aria-label="Деление такта">
        <button type="button" data-div="4" aria-pressed="true">16-е</button>
        <button type="button" data-div="3" aria-pressed="false">Триоли</button>
        <button type="button" data-div="6" aria-pressed="false">Секстоли</button>
        <button type="button" data-div="8" aria-pressed="false">32-е</button>
      </div>
      <button class="chip" id="btnDup" type="button">Копия такта</button>
      <button class="chip" id="btnClear" type="button">Очистить</button>
      <button class="chip" id="btnDel" type="button">Удалить</button>
      <button class="chip" id="btnRep" type="button" aria-pressed="false">Повтор</button>
      <button class="chip" id="btnUndo" type="button" disabled>Отменить</button>
      <button class="chip" id="btnStaff" type="button" aria-pressed="false">Писать на стане</button>
      <button class="chip" id="btnMetro" type="button">Просто метроном</button>
      <button class="chip" id="btnRec" type="button">Записать игру</button>
    </div>
    <div class="pad" id="pad">
      <div class="tape" id="tape" role="group" aria-label="Лента тактов"></div>
    </div>
    <div class="palette">
      <div class="seg" id="toolSeg" aria-label="Тип удара">
        <button type="button" data-tool="n" aria-pressed="true">Удар</button>
        <button type="button" data-tool="a" aria-pressed="false">Акцент &gt;</button>
        <button type="button" data-tool="g" aria-pressed="false">Гост ( )</button>
      </div>
    </div>
    <p class="hint" id="hintGrid"></p>
    <p class="status" id="status"></p>
    <p class="status" id="credits"></p>
  </main>

  <main id="viewSheet" hidden>
    <div class="sheetbar">
      <span id="perLine">Тактов в строке</span>
      <div class="seg" id="bplSeg">
        <button type="button" data-bpl="1" aria-pressed="false">1</button>
        <button type="button" data-bpl="2" aria-pressed="true">2</button>
        <button type="button" data-bpl="4" aria-pressed="false">4</button>
      </div>
      <button class="chip" id="btnPdf" type="button" hidden>Скачать PDF</button>
      <button class="chip" id="btnPng" type="button" hidden>Сохранить картинку</button>
      <button class="chip" id="btnPages" type="button">Страницы картинками</button>
    </div>
    <div class="paper" id="sheet"></div>
    <p class="hint" id="hintSheet"></p>
    <p class="hint" id="dlNote">Скачивание PDF и картинки в этом окне недоступно.</p>
  </main>

  <div class="langrow">
    <div class="seg" id="langSeg" aria-label="Language">
      <button type="button" data-lang="ru" aria-pressed="true" lang="ru">Русский</button>
      <button type="button" data-lang="en" aria-pressed="false" lang="en">English</button>
    </div>
  </div>

  <footer class="transport">
    <button class="play" id="play" type="button" aria-label="Играть"></button>
    <div class="bpm">
      <button type="button" id="bpmDown" aria-label="Темп меньше на 5">−</button>
      <input id="bpm" type="number" inputmode="numeric" min="40" max="240" aria-label="Темп, ударов в минуту">
      <button type="button" id="bpmUp" aria-label="Темп больше на 5">+</button>
    </div>
    <button class="tog" id="loop" type="button" aria-pressed="false">Цикл такта</button>
    <button class="tog" id="click" type="button" aria-pressed="false">Метроном</button>
  </footer>
</div>

<div class="panel" id="songsPanel" hidden>

  saveLocal(){ try{ localStorage.setItem(LS,JSON.stringify({songs:state.songs.filter(s=>!s.demo).map(s=>pack(s)),cur:state.curSong,bpl:state.bpl,click:state.click,lang:LANG})); return true; }catch(e){ return false; } },

      const col=db.collection('data/users/'+uid);

      this.col=col;

// put in the rudiments that are not there: once when the app first meets this library, and again when asked
function ensureLibrary(force){
  let v=''; try{ v=localStorage.getItem(LIB_SLOT)||''; }catch(e){}
  if(v===LIB_VER&&!force) return 0;
  const have=new Set(state.songs.map(x=>x.id)), add=libSongs().filter(x=>!have.has(x.id));

function joinSongs(ids){
  const parts=ids.map(id=>state.songs.find(x=>x.id===id)).filter(Boolean); if(!parts.length) return null;
  const bars=[];
  for(const p of parts) p.bars.forEach((b,i)=>{
    const nb=Object.assign({div:b.div,c:{}},barMeta(b)); for(const k of ROWS) nb.c[k]=b.c[k].join(''); nb.sg=sigOf(p,b); delete nb.nm;
    if(i===0) nb.nm=partName(p);
    // a tempo written inside a part is kept relative to the new song's tempo
    if(nb.tm){ nb.tm=clamp(Math.round(nb.tm*parts[0].bpm/(p.ref||p.bpm)),40,240); }
    bars.push(nb);
  });
  const n=unpack({id:newId(),title:tx('compTitle')+' · '+parts.length,bpm:parts[0].bpm,sig:sigOf(parts[0],parts[0].bars[0]),swing:parts[0].swing,folder:curFolder(),bars});

}

/* ---------- playback ---------- */
const PLAY_ICON='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></svg>';
const STOP_ICON='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor"/></svg>';
const Player={
  on:false,timer:0,raf:0,next:0,bar:0,slot:0,queue:[],done:false,
  start(){
    const c=Snd.ensure(); if(!c){ toast(tx('tNoAudio')); return; }
    this.on=true; this.done=false; this.queue=[]; this.taken=new Set(); this.bar=state.cur; this.slot=0; this.next=c.currentTime+.09;
    $('play').innerHTML=STOP_ICON; $('play').setAttribute('aria-label',tx('stop'));
    this.timer=setInterval(()=>this.pump(),25); this.pump();
    const loop=()=>{ if(!this.on) return; this.draw(); this.raf=requestAnimationFrame(loop); }; this.raf=requestAnimationFrame(loop);
    setTimeout(()=>{ if(this.on&&Snd.state()!=='running') toast(tx('tAudioOff',Snd.state())); },900);
  },
  stop(){
    this.on=false; clearInterval(this.timer); cancelAnimationFrame(this.raf); this.queue=[]; this.shown=-1;
    if($('ph')) $('ph').hidden=true; $('play').innerHTML=PLAY_ICON; $('play').setAttribute('aria-label',tx('play'));
  },
  pump(){
    const s=song(), now=Snd.now(); if(!this.taken) this.taken=new Set();
    while(!this.done&&this.next<now+.13){
      if(state.loop&&this.slot===0) this.bar=state.cur;
      const bar=s.bars[this.bar]; if(!bar){ this.done=true; this.queue.push({t:this.next,end:true}); break; }
      const BS=SOf(s,bar), n=BS.beats*bar.div; if(this.slot>=n) this.slot=0;
      const dur=60/tempoAt(s,this.bar)/bar.div;
      // swing: the eighth after the beat comes later (all the way to a triplet's third at "Шаффл"); sixteenths stay inside each half
      let at=this.next;
      if(s.swing&&bar.div===4&&!BS.compound){
        const d=s.swing/100/6, k=this.slot%4, p=[0,(.5+d)/2,.5+d,.5+d+(.5-d)/2][k];
        at=this.next+(p-k/4)*dur*4;
      }
      for(const inst of INST){ const v=bar.c[inst.id][this.slot]; if(v==='3'){ for(let k=0;k<3;k++) Snd.hit(inst.id,'n',at+k*dur*2/3); } else if(v&&v!=='-') Snd.hit(inst.id,v,at,dur); }
      if(state.click&&this.slot%(bar.div*(BS.cut?2:1))===0) Snd.tick(this.next,this.slot===0);
      this.queue.push({t:this.next,bar:this.bar,slot:this.slot,n});
      this.next+=dur; this.slot++;
      if(this.slot>=n){ this.slot=0; if(!state.loop){
        if(bar.re&&!this.taken.has(this.bar)){ this.taken.add(this.bar); let j=this.bar; while(j>0&&!s.bars[j].rs&&!s.bars[j-1].re) j--; this.bar=j; }
        else this.bar++;
        if(this.bar>=s.bars.length){ this.done=true; this.queue.push({t:this.next,end:true}); } } }
    }
  },
  draw(){
    const now=Snd.now(); let ev=null;
    while(this.queue.length&&this.queue[0].t<=now) ev=this.queue.shift();
    if(!ev) return;
    if(ev.end){ this.stop(); return; }
    if(ev.bar!==this.shown){ this.shown=ev.bar; if(!state.loop&&ev.bar!==state.cur){ state.cur=ev.bar; if(state.view==='grid'){ markCur(); scrollToBar(ev.bar,true); } } }
    if(state.view!=='grid') return;
    const ph=$('ph'); if(!ph||!BARW) return; const w=BARW/ev.n;
    ph.hidden=false; ph.style.left=(LBL+BARW*ev.bar+w*ev.slot)+'px'; ph.style.width=w+'px';
  }
};

/* ---------- export ---------- */
let downloads=null, exporting=false;
function rasterize(svg,w,h,type,q){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{ const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,w,h); g.drawImage(img,0,0,w,h); c.toBlob(b=>b?res(b):rej(new Error('encode')),type,q); };
    img.onerror=()=>rej(new Error('img'));
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  });
}
const fileName=s=>(s.title||tx('fileDef')).replace(/[\\/:*?"<>|]+/g,' ').trim().slice(0,60)||tx('fileDef');
async function nativeSave(o){
  const type=/\.pdf$/i.test(o.filename)?'application/pdf':/\.json$/i.test(o.filename)?'application/json':'image/png';
  const blob=o.data instanceof Blob?o.data:new Blob([o.data],{type});
  try{
    const file=new File([blob],o.filename,{type});
    if(navigator.canShare&&navigator.canShare({files:[file]})&&matchMedia('(pointer:coarse)').matches){ await navigator.share({files:[file]}); return {status:'saved'}; }
  }catch(e){ if(e&&e.name==='AbortError'){ const err=new Error('declined'); err.code='declined'; throw err; } }
  const a=document.createElement('a'), url=URL.createObjectURL(blob); a.href=url; a.download=o.filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000); return {status:'saved'};
}
async function exportFile(kind){
  if(!downloads||exporting) return; exporting=true;
  try{
    const s=song();
    if(kind==='png'){
      const r=sheetSVG(s,{bpl:state.bpl,ink:'#111418',paper:'#ffffff',fixed:true});
      const k=Math.min(2000/r.W,Math.sqrt(14e6/(r.W*r.H)));
      await downloads.save({filename:fileName(s)+'.png',data:await rasterize(r.svg,Math.round(r.W*k),Math.round(r.H*k),'image/png')});
    } else {
      toast(tx('tPdf'));
      await downloads.save({filename:fileName(s)+'.pdf',data:await makePdf(s,state.bpl)});
    }
  }catch(e){ if(!e||e.code!=='declined') toast(tx('tFile')); }
  exporting=false;
}
// A4 pages, each one the engraved sheet as an image
const PDF={PW:595.28,PH:841.89,M:24};
async function renderPages(s,bpl,type,q){
  let minW=sheetLayout(s,2).W, L=sheetLayout(s,bpl,minW), H=Math.round(L.W*(PDF.PH-2*PDF.M)/(PDF.PW-2*PDF.M));
  // a sheet that would only just spill onto a second page is drawn a little smaller so it fits on one
  const need=L.headH+22+L.sys.reduce((a,x)=>a+x.h,0);
  if(need>H&&need<=H*1.3){ minW=Math.ceil(L.W*need/H)+1; L=sheetLayout(s,bpl,minW); H=Math.round(L.W*(PDF.PH-2*PDF.M)/(PDF.PW-2*PDF.M)); }
  const ranges=[];
  for(let q0=0;q0<L.nSys;){
    const avail=ranges.length?H-44:H-L.headH-22; let used=0, q1=q0;
    while(q1<L.nSys&&(q1===q0||used+L.sys[q1].h<=avail)){ used+=L.sys[q1].h; q1++; }
    ranges.push([q0,q1]); q0=q1;
  }
  if(!ranges.length) ranges.push([0,0]);
  const w=1600, h=Math.round(w*H/L.W), out=[];
  for(let i=0;i<ranges.length;i++){
    const r=sheetSVG(s,{bpl,minW,ink:'#111418',paper:'#ffffff',fixed:true,sys0:ranges[i][0],sys1:ranges[i][1],head:i===0,top:20,H,footer:(s.title||tx('untitled'))+' · '+tx('pageOf',i+1,ranges.length)});
    out.push({blob:await rasterize(r.svg,w,h,type,q),w,h});
  }
  return out;
}

// JSON with every character outside ASCII written as \uXXXX, so it can sit in the PDF byte for byte
const asciiJSON=o=>JSON.stringify(o).replace(/[\u007f-\uffff]/g,c=>'\\u'+c.charCodeAt(0).toString(16).padStart(4,'0'));
async function makePdf(s,bpl){
  const list=Array.isArray(s)?s:[s], PW=PDF.PW, PHt=PDF.PH, M=PDF.M, pages=[];
  for(let k=0;k<list.length;k++) for(const p of await renderPages(list[k],Array.isArray(bpl)?bpl[k]:bpl,'image/jpeg',.93)) pages.push({jpg:new Uint8Array(await p.blob.arrayBuffer()),w:p.w,h:p.h});
  // the notes themselves travel inside the PDF as an attached file, so the app can add them back from it
  const data=asciiJSON({app:'drumbook',v:1,songs:list.map(x=>pack(x,true))}), E=3+pages.length*3;
  const enc=new TextEncoder(), parts=[], offs=[]; let len=0;
  const push=x=>{ const u=typeof x==='string'?enc.encode(x):x; parts.push(u); len+=u.length; };
  const obj=(n,body)=>{ offs[n]=len; push(n+' 0 obj\n'); body(); push('\nendobj\n'); };
  push('%PDF-1.4\n');
  obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R /Names << /EmbeddedFiles << /Names [(drumbook.json) '+(E+1)+' 0 R] >> >> >>'));
  obj(2,()=>push('<< /Type /Pages /Count '+pages.length+' /Kids ['+pages.map((_,i)=>(3+i*3)+' 0 R').join(' ')+'] >>'));
  pages.forEach((p,i)=>{
    const a=3+i*3, c='q '+f(PW-2*M)+' 0 0 '+f(PHt-2*M)+' '+M+' '+M+' cm /Im0 Do Q';
    obj(a,()=>push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+PW+' '+PHt+'] /Resources << /XObject << /Im0 '+(a+2)+' 0 R >> >> /Contents '+(a+1)+' 0 R >>'));
    obj(a+1,()=>push('<< /Length '+c.length+' >>\nstream\n'+c+'\nendstream'));
    obj(a+2,()=>{ push('<< /Type /XObject /Subtype /Image /Width '+p.w+' /Height '+p.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+p.jpg.length+' >>\nstream\n'); push(p.jpg); push('\nendstream'); });
  });
  obj(E,()=>push('<< /Type /EmbeddedFile /Subtype /application#2Fjson /Params << /Size '+data.length+' >> /Length '+data.length+' >>\nstream\n'+data+'\nendstream'));
  obj(E+1,()=>push('<< /Type /Filespec /F (drumbook.json) /UF (drumbook.json) /Desc (Drumbook songs) /EF << /F '+E+' 0 R >> >>'));
  const xref=len, total=E+2; let x='xref\n0 '+total+'\n0000000000 65535 f \n';
  for(let k=1;k<total;k++) x+=String(offs[k]).padStart(10,'0')+' 00000 n \n';
  push(x+'trailer\n<< /Size '+total+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF\n');
  return new Blob(parts,{type:'application/pdf'});
}

/* ---------- adding songs from a PDF or a .json file ---------- */
function bytesText(u){ let t=''; for(let i=0;i<u.length;i+=8192) t+=String.fromCharCode.apply(null,u.subarray(i,i+8192)); return t; }
const PDF_MARK='{"app":"drumbook"';
function songsInText(t){
  let out=[], k=0;
  while((k=t.indexOf(PDF_MARK,k))>=0){
    const e=t.indexOf('endstream',k), raw=(e<0?t.slice(k):t.slice(k,e)).trim();
    try{ const d=JSON.parse(raw); if(d&&Array.isArray(d.songs)) out=out.concat(d.songs); }catch(err){}
    k+=PDF_MARK.length;
  }
  return out;
}
async function songsFromPdf(buf){
  const u=new Uint8Array(buf), t=bytesText(u);
  let list=songsInText(t);
  if(list.length||typeof DecompressionStream!=='function') return list;
  // a PDF saved again by another app may keep the attached notes compressed

      const s=state.songs.find(x=>x.id===d.dataset.del); if(!s) return;
      state.songs=state.songs.filter(x=>x!==s);
      if(!state.songs.length){ const n=unpack({id:newId(),title:tx('newSong'),bpm:96,sig:'4/4',bars:[]}); n.demo=true; n.tk='newSong'; state.songs=[n]; }
      if(state.curSong===s.id){ if(Player.on) Player.stop(); state.curSong=state.songs[0].id; state.cur=0; state.undo=[]; }
      Store.remove(s); renderSongs(); renderAll();
    });
  });
  $('folderBar').addEventListener('click',e=>{
    const pk=e.target.closest('[data-folder-pick]');
    if(pk){ const v=pk.dataset.folderPick; state.folder=v===''||v===NO_FOLDER||v===LIB?v:($('folderBar')._names[+v]||''); saveFolders(); renderSongs(); return; }
    if(e.target.closest('#folderAdd')){ openFolderBox(null); return; }
    const del=e.target.closest('#folderDel');
    if(del) armed(del,tx('sure'),()=>{
      const f=curFolder(); if(!f) return;
      for(const s of state.songs) if(s.folder===f){ s.folder=''; Store.save(s); }
      folderNames=folderNames.filter(x=>x!==f); state.folder=''; saveFolders(); renderSongs(); toast(tx('folderDeleted'));
    });
  });
  const makeFolder=()=>{
    const f=$('folderName').value.trim().replace(/^#+\s*/,'').slice(0,40); if(!f){ $('folderName').focus(); return; }
    if(!folderNames.includes(f)) folderNames.push(f);
    $('folderBox').hidden=true;
    if(folderMove){ const id=folderMove; folderMove=null; saveFolders(); moveSong(id,f); }
    else { state.folder=f; saveFolders(); renderSongs(); }
  };
  $('folderSave').addEventListener('click',makeFolder);
  $('folderName').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); makeFolder(); } });
  $('folderCancel').addEventListener('click',()=>{ $('folderBox').hidden=true; folderMove=null; });
  $('btnNew').addEventListener('click',()=>{
    const n=unpack({id:newId(),title:tx('newSong'),bpm:96,sig:'4/4',bars:[],folder:curFolder()}); state.songs.unshift(n); Store.save(n); setSong(n.id); $('songsPanel').hidden=true; $('title').focus(); $('title').select();
  });
  $('btnRep').addEventListener('click',()=>{
    const s=song(), bar=curBar(); pushUndo();
    if(bar.rs||bar.re){ delete bar.rs; delete bar.re; } else { bar.rs=true; bar.re=true; }
    Store.save(s); refreshBar(state.cur); if(state.cur>0) refreshBar(state.cur-1); renderTools();
  });
  $('btnImport').addEventListener('click',()=>{ $('fileImport').value=''; $('fileImport').click(); });
  $('fileImport').addEventListener('change',async e=>{
    const file=e.target.files&&e.target.files[0]; if(!file) return;
    let list=[], isPdf=/\.pdf$/i.test(file.name||'')||file.type==='application/pdf', backup=null;
    try{
      const buf=await file.arrayBuffer();
      if(bytesText(new Uint8Array(buf,0,Math.min(5,buf.byteLength)))==='%PDF-'){ isPdf=true; list=await songsFromPdf(buf); }
      else if(!isPdf){ const d=JSON.parse(new TextDecoder().decode(buf).replace(/^\uFEFF/,'')); if(d&&d.backup) backup=d; list=Array.isArray(d)?d:d&&Array.isArray(d.songs)?d.songs:(d&&Array.isArray(d.bars)?[d]:[]); }
    }catch(err){ list=[]; }
    list=list.filter(x=>x&&Array.isArray(x.bars)&&x.bars.length).slice(0,backup?5000:200);
    if(backup&&Array.isArray(backup.folders)){ for(const f of backup.folders) if(typeof f==='string'&&f.trim()&&!f.startsWith('#')&&!folderNames.includes(f.trim().slice(0,40))) folderNames.push(f.trim().slice(0,40)); saveFolders(); }
    if(!list.length){ if(backup){ renderSongs(); toast(tx('tDupe')); } else toast(tx(isPdf?'tNoPdfData':'tBadFile')); return; }
    // a song that is already in the list exactly as it is in the file is not added a second time
    const added=addSongs(list,!!backup);
    // after a restore the list stays open, on "All" unless the folder in view got songs back
    if(backup){ if(state.folder===NO_FOLDER||(curFolder()&&!added.some(x=>x.folder===state.folder))) state.folder=''; saveFolders(); renderSongs(); toast(tx(added.length<list.length?'tRestored':'tRestoredAll',added.length),6000); return; }
    if(!added.length){ toast(tx('tDupe')); $('songsPanel').hidden=true; return; }
    $('songsPanel').hidden=true; toast(tx('tImported',added.length));
  });
  $('btnPhoto').addEventListener('click',()=>{ if(!PhotoMode||photoCtl) return; if(PhotoMode==='api'&&!getKey()){ toggleKeyBox(true); return; } $('filePhoto').value=''; $('filePhoto').click(); });
  $('btnKey').addEventListener('click',()=>toggleKeyBox());
  $('keySave').addEventListener('click',()=>{
    const k=$('apiKey').value.trim();
    // Google now issues keys as AQ.… (older ones AIza…): accept any whole key, just not a stray word or a space
    if(!/^[A-Za-z0-9._-]{20,}$/.test(k)){ toast(tx('keyBadGem'),5000); return; }
    try{ localStorage.setItem(GEM_SLOT,k); }catch(e){ toast(tx('tSave')); return; }
    toggleKeyBox(false); toast(tx('keySaved'));
  });
  $('keyDel').addEventListener('click',e=>armed(e.currentTarget,tx('sure'),()=>{ try{ localStorage.removeItem(GEM_SLOT); }catch(err){} $('apiKey').value=''; toggleKeyBox(false); toast(tx('keyDeleted')); }));
  $('filePhoto').addEventListener('change',e=>{ const fs=e.target.files; if(fs&&fs.length) readPhotos(fs); });
  $('photoStop').addEventListener('click',()=>{ if(photoCtl) photoCtl.abort(); });
  $('btnExport').addEventListener('click',saveBackup);
  $('btnPick').addEventListener('click',()=>setPick(true));
  $('pickCancel').addEventListener('click',()=>setPick(false));
  $('pickUndo').addEventListener('click',()=>{ if(state.pick&&state.pick.length){ state.pick.pop(); renderSongs(); } });
  $('pickGo').addEventListener('click',()=>{
    const r=state.pick&&joinSongs(state.pick); if(!r) return;
    setPick(false); state.songs=state.songs.filter(x=>!x.demo); state.songs.unshift(r.song); Store.save(r.song); setSong(r.song.id);
    $('songsPanel').hidden=true; toast(tx('compDone',r.parts,r.song.bars.length),7000);
  });
  $('btnRestore').addEventListener('click',()=>{ $('fileImport').value=''; $('fileImport').click(); });
  $('btnPng').addEventListener('click',()=>exportFile('png'));
  $('btnPdf').addEventListener('click',()=>exportFile('pdf'));
  $('btnPages').addEventListener('click',togglePages);
  const onSize=()=>{ if(state.view==='grid'&&$('tape').clientWidth&&$('tape').clientWidth!==padW) renderTape(); };
  if(window.ResizeObserver) new ResizeObserver(onSize).observe($('pad')); else window.addEventListener('resize',onSize);

  applyLang(); renderAll();
  document.addEventListener('visibilitychange',()=>{ if(document.hidden){ if(Player.on) Player.stop(); Snd.rest(); } });
  setTimeout(()=>Snd.preload(),300);
  const fontCheck=()=>{
    try{
      const g=document.createElement('canvas').getContext('2d'), t='МЕТРОНОМ 123';
      g.font="700 20px 'Sofia Sans Extra Condensed',monospace"; const a=g.measureText(t).width;
      g.font='700 20px monospace'; const b=g.measureText(t).width;
      document.documentElement.classList.toggle('nf',Math.abs(a-b)<.5);
      if(state.view==='grid') renderTape();
    }catch(e){}
  };
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fontCheck); else setTimeout(fontCheck,1500);
  setTimeout(fontCheck,4000);
  Store.initCloud();
  initPhoto();
  if(window.claude&&typeof window.claude.use==='function') window.claude.use('downloads').then(d=>{ if(d){ downloads=d; $('btnPng').hidden=false; $('btnPdf').hidden=false; applyLang(); } }).catch(()=>{});
  else { downloads={save:nativeSave}; $('btnPng').hidden=false; $('btnPdf').hidden=false; applyLang(); }
}
init();
</script>
<script>
/* installed-app extras: offline copy and storage that the phone should keep */
if('serviceWorker' in navigator) window.addEventListener('load',function(){ navigator.serviceWorker.register('js.js').catch(function(){}); });
if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(function(){});
</script>
</body>
